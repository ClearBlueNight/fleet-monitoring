# Persistencija: AOF je glavni mehanizam (master podaci, alarmi, dodele zive u Redisu).
appendonly yes
appendfsync everysec
appenddirname "appendonlydir"
dir /data

# RDB snapshot kao dodatna zastita
save 900 1
save 300 100

# Ne koristimo TTL na operativnim kljucevima; bez eviction-a
maxmemory-policy noeviction
